[package]
name = "traffic-camera-viewer"
version = "0.4.0"
edition = "2024"
authors = ["Peter Feerick"]
license = "GPL-3.0-or-later"
description = "Desktop viewer for Queensland traffic cameras with configurable grid, district filtering, and auto-refresh"
repository = "https://github.com/pfeerick/traffic-camera-viewer"

[[bin]]
name = "traffic-camera-viewer"
path = "src/main.rs"

[dependencies]
# UI framework
eframe       = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui         = "0.34.1"

# HTTP client (rustls avoids needing OpenSSL on Windows)
reqwest      = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }

# Async runtime
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# JPEG decoding (only jpeg feature — cameras serve JPEG only)
image        = { version = "0.25", default-features = false, features = ["jpeg"] }

# Async-to-sync bridge for egui render loop
poll-promise = { version = "0.3.0", features = ["tokio"] }

# Config persistence (TOML in %APPDATA%)
confy        = "2.0.0"

# Time (status bar display + cache-busting timestamps)
chrono       = { version = "0.4", default-features = false, features = ["clock"] }

# Error types
thiserror    = "2"

# Native file/folder picker dialog
rfd          = "0.17.2"

# Logging
log          = "0.4"
env_logger   = "0.11"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# needed for round-trip serialization test in config.rs
toml = "0.9"

[lints.clippy]
# egui slider pattern: local f64 mutated by slider then cast back to storage type.
# These casts are safe and intentional — suppressing the pedantic warnings.
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
# chrono Duration::seconds takes i64; our interval is u64 (always small, safe).
cast_possible_wrap       = "allow"
# show() functions are long by necessity (many UI sections in one panel).
too_many_lines           = "allow"
# mul_add suggestion in cell_h calculation is less readable, not a real perf win.
suboptimal_flops         = "allow"
# Nested if-let chains read more clearly than option_if_let_else rewrites here.
option_if_let_else       = "allow"
# map_unwrap_or vs map().unwrap_or() — style preference.
map_unwrap_or            = "allow"
# grid::show() takes &mut AppState for interface consistency with other panels.
needless_pass_by_ref_mut = "allow"

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
