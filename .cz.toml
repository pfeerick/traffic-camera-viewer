[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
version = "0.7.0"
version_files = [
    "src-tauri/Cargo.toml",
    "src-tauri/tauri.conf.json",
    "package.json",
]
tag_format = "v$version"
update_changelog_on_bump = true
bump_message = "chore(release): bump version $current_version to $new_version"
annotated_tag = true
ignored_tag_patterns = ["latest"]
pre_bump_hooks = [
    "bun install",
    "git add bun.lock",
    "cargo check --manifest-path src-tauri/Cargo.toml",
    "git add Cargo.lock",
]
# Push the bump commit and its tag together, atomically. A tag that only exists
# locally is indistinguishable from one deleted upstream, so the next fetch
# prunes it when fetch.pruneTags is set — losing the release tag.
post_bump_hooks = [
    "git push --atomic --follow-tags origin HEAD",
]
