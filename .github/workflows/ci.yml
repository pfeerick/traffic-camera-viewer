name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Cancel in-progress runs for the same ref. Using github.ref (not github.sha)
# keeps branch pushes and tag pushes in separate concurrency groups, so
# `git push --follow-tags` never cancels the wrong run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev cmake
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev cmake
      - name: Run tests
        run: cargo test

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: traffic-camera-viewer.exe
            artifact: traffic-camera-viewer-windows-x86_64.exe
          - name: Linux
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: traffic-camera-viewer
            artifact: traffic-camera-viewer-linux-x86_64
          - name: macOS
            target: aarch64-apple-darwin
            os: macos-latest
            bin: traffic-camera-viewer
            artifact: traffic-camera-viewer-macos-arm64
          # Uncomment to add macOS Intel builds:
          # - name: macOS (Intel)
          #   target: x86_64-apple-darwin
          #   os: macos-15-intel
          #   bin: traffic-camera-viewer
          #   artifact: traffic-camera-viewer-macos-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev cmake
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish release
    needs: [lint, test, build]
    # Only publish on main branch pushes and version tags; skip for PRs and feature branches.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Rolling latest release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from the latest commit on `main`.
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: artifacts/*

      - uses: actions/checkout@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output release_notes.md

      - name: Versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          make_latest: true
          files: artifacts/*