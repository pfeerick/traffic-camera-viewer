name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/release.yml'

# Cancel in-progress runs for the same ref (branch or PR) — but never for main,
# where release.yml gates publishing on this workflow's conclusion being
# 'success'. Cancelling main's CI turns into a silently missing release (a
# pushed tag with no GitHub release), since 'cancelled' never satisfies that
# gate. Pushes to main queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome + Prettier
        run: bun run check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: svelte-check + server tsc
        run: bun run typecheck

  # Runs the shared pre-commit hygiene suite (whitespace/EOL/YAML/JSON/TOML checks,
  # private-key detection, etc.) so it's enforced even for contributors who never ran
  # `pre-commit install` locally, and so `git commit --no-verify` can't silently skip it.
  # Skips:
  #   - biome: shells out to `bun run check:fix`, which needs a Bun install; the `lint`
  #     job above already covers Biome + Prettier.
  #   - cargo-fmt: needs a Rust toolchain; `lint-rust` already runs `cargo fmt --check`.
  hooks:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: pipx:pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: biome,cargo-fmt

  # PR-only: validates every commit message in the PR against Conventional Commits.
  commit-messages:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # --rev-range needs full history to walk the base..head range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: pipx:commitizen
      # Use head.sha rather than HEAD: HEAD here is checkout's synthetic merge commit
      # of the PR into base, whose "Merge ... into ..." subject is not conventional.
      - name: Check commit messages
        run: cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Check formatting
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Run tests
        run: cargo test
        working-directory: src-tauri

  build:
    name: Build (${{ matrix.name }})
    # commit-messages is deliberately absent: it is PR-only, so on a push it is skipped,
    # and a skipped dependency skips every job that needs it — which would silently stop
    # build (and therefore the whole release pipeline) on every push to main. It gates the
    # PR by failing its own check, which is all it needs to do.
    needs: [lint, typecheck, hooks, lint-rust, test-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact-name: tauri-windows
          - name: Linux
            os: ubuntu-latest
            artifact-name: tauri-linux
          - name: macOS
            os: macos-latest
            artifact-name: tauri-macos
          # Uncomment to add macOS Intel builds:
          # - name: macOS (Intel)
          #   os: macos-15-intel
          #   artifact-name: tauri-macos-intel
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: bun
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.os }}
      - name: Install Linux WebKit deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: bunx tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          # Repo root, not src-tauri/: the root Cargo.toml is a workspace, so Cargo
          # puts the target dir alongside it. src-tauri/target/ never exists, and
          # uploading from there silently produces an empty artifact.
          path: target/release/bundle/
          if-no-files-found: error
