name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

# Only one release run per commit. When a tag and branch push arrive
# together (e.g. git push --follow-tags), the tag run cancels the
# branch run so only the versioned release is produced.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: traffic-camera-viewer.exe
            artifact: traffic-camera-viewer-windows-x86_64.exe
          - name: Linux
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: traffic-camera-viewer
            artifact: traffic-camera-viewer-linux-x86_64
          - name: macOS
            target: aarch64-apple-darwin
            os: macos-latest
            bin: traffic-camera-viewer
            artifact: traffic-camera-viewer-macos-arm64
          # Uncomment to add macOS Intel builds:
          # - name: macOS (Intel)
          #   target: x86_64-apple-darwin
          #   os: macos-15-intel
          #   bin: traffic-camera-viewer
          #   artifact: traffic-camera-viewer-macos-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev cmake
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Rolling latest release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from the latest commit on `main`.
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: artifacts/*

      - uses: actions/checkout@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
          output: release_notes.md

      - name: Versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          make_latest: true
          files: artifacts/*
