name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Only one release can publish at a time; newer run cancels any in-progress one.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Publish release
    # Only run when CI passed; a failed build should never publish.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # required to download artifacts from the triggering run

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          merge-multiple: true

      # Flatten nested Tauri bundle directories into a single artifacts/ dir,
      # keeping only the distributable files (exe, AppImage, deb, dmg).
      - name: Flatten bundle artifacts
        run: |
          mkdir -p flat
          find artifacts -type f \( \
            -name "*.exe" -o -name "*.msi" -o \
            -name "*.AppImage" -o -name "*.deb" -o \
            -name "*.dmg" -o -name "*.app.tar.gz" \
          \) -exec cp {} flat/ \;
          ls flat/

      - name: Detect version tag
        id: tag
        run: |
          TAG=$(git tag --points-at ${{ github.event.workflow_run.head_sha }} \
                | grep '^v' | head -1)
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      # ── Rolling latest (no version tag on commit) ─────────────────────────

      - name: Rolling latest release
        if: steps.tag.outputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release create latest \
            --title "Latest Build" \
            --notes $'Automated build from the latest commit on `main`.\nCommit: ${{ github.event.workflow_run.head_sha }}' \
            --prerelease \
            --repo ${{ github.repository }} \
            flat/*

      # ── Versioned release (v* tag found on commit) ────────────────────────

      - name: Rename artifacts for versioned release
        if: steps.tag.outputs.version != ''
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          cd flat
          for f in *; do
            ext="${f##*.}"
            base="${f%.*}"
            newname="${base}-${VERSION}.${ext}"
            mv "$f" "$newname"
          done

      # git-cliff previously generated notes here, but with no cliff.toml in the repo it
      # fell back to its own built-in defaults — a second changelog generator producing
      # different output from CHANGELOG.md, which commitizen already maintains. Extract
      # this version's section from CHANGELOG.md instead, so there is exactly one source.
      - name: Extract changelog for this version
        if: steps.tag.outputs.version != ''
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          awk "/^## ${TAG} /{found=1; next} /^## v/{if(found) exit} found{print}" CHANGELOG.md > release_notes.md

      - name: Append downloads table to release notes
        if: steps.tag.outputs.version != ''
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          cat >> release_notes.md << EOF

          ## Downloads

          | Platform | File |
          |----------|------|
          | Windows (x86-64) | \`.exe\` or \`.msi\` installer |
          | Linux (x86-64) | \`.AppImage\` or \`.deb\` package |
          | macOS (Apple Silicon) | \`.dmg\` image |
          EOF

      - name: Versioned release
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.version }}" \
            --title "${{ steps.tag.outputs.version }}" \
            --notes-file release_notes.md \
            --latest \
            --repo ${{ github.repository }} \
            flat/*
