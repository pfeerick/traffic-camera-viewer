# mise's rust tool is rustup under the hood, and installs rustup itself if missing.
# The channel here only bootstraps it — rustup then reads rust-toolchain.toml, which
# stays the single source of truth for the toolchain CI and local builds actually use.
# Keep the two in agreement. Components are listed because CI enforces both.
[tools]
rust = { version = "stable", components = "rustfmt,clippy", profile = "minimal" }
bun = "1.3.14"
"pipx:commitizen" = "4.17.0"
"pipx:pre-commit" = "4.6.1"

[tasks.setup]
description = "Install dependencies and git hooks"
run = [
  "bun install",
  "pre-commit install --hook-type pre-commit --hook-type commit-msg",
]

# Output lands in target/ at the repo root, not src-tauri/target/ — the root
# Cargo.toml is a workspace, so Cargo puts the target dir beside it.
#   installers: target/release/bundle/{nsis,msi}/   (deb/AppImage on Linux, dmg on macOS)
#   bare exe:   target/release/traffic-camera-viewer
# Narrow the bundle set with: mise run dist --bundles nsis
[tasks.dist]
description = "Build the desktop app and its platform installers"
run = "bun run tauri:build"

[tasks.check]
description = "Lint, format-check and type-check the frontend"
run = ["bun run check", "bun run typecheck"]

[tasks.lint-rust]
description = "Run the Rust checks CI enforces"
dir = "src-tauri"
run = ["cargo fmt --check", "cargo clippy -- -D warnings", "cargo test"]
