repos:
  # Auto-format Rust source with rustfmt (modifies files in place)
  # Local hook needed because Cargo.toml lives in src-tauri/, not the repo root
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml
        language: system
        types: [rust]
        pass_filenames: false

  # Enforce conventional commit messages (feat:, fix:, chore:, etc.)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, perf, ci, build]
